<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display:grid;
            grid-template-columns: auto auto auto;
            column-gap: 50px;
            row-gap: 25px;
            background-color: dodgerblue;
            padding: 10px;
        }
        .container div {
            background-color: #f1f1f1;
            border: 5px solid black;
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }
    </style>
<body>
    <h1> Grid layout </h1>
    <p >A Grid layout with 5 container</p>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>  
    </div>
</body>
</head>
</html>
